name: StormWatch CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stormwatch_ci
          POSTGRES_USER: stormwatch
          POSTGRES_PASSWORD: stormwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stormwatch -d stormwatch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: stormwatch_ci
      DB_SCHEMA: stormwatch
      DB_USER: stormwatch
      DB_PASSWORD: stormwatch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install StormWatch
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Upgrade clean database to head
        run: alembic upgrade head
      - name: Check schema matches SQLAlchemy metadata
        run: alembic check
      - name: Verify downgrade and re-upgrade
        run: alembic downgrade base && alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: [quality, migrations]
    steps:
      - uses: actions/checkout@v6

      - name: Build API image
        run: docker build --tag stormwatch-api:${{ github.sha }} .

      - name: Build worker image
        run: docker build -f Dockerfile.worker --tag stormwatch-worker:${{ github.sha }} .
